<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>WDŚ - WYDZIAŁ DOCHODZENIOWO-ŚLEDCZY</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>SYSTEM EWIDENCJI OPERACYJNEJ WDŚ</h1>
    <div class="sub-header">TAJNE / KLAUZULA OGRANICZONA</div>
  </header>

  <div class="grid-container">
    <!-- FORMULARZ REJESTRACJI -->
    <div class="panel">
      <h2>[+] REJESTRACJA PODMIOTU</h2>
      <form id="addPersonForm" enctype="multipart/form-data">
        <label>Imię</label>
        <input type="text" name="imie" required autocomplete="off">

        <label>Nazwisko</label>
        <input type="text" name="nazwisko" required autocomplete="off">

        <label>Numer PESEL</label>
        <input type="text" name="pesel" maxlength="11" required autocomplete="off">

        <label>Plik zdjęcia (Lokalnie)</label>
        <input type="file" name="zdjecie_file" accept="image/*">

        <label>LUB URL do zdjęcia</label>
        <input type="url" name="zdjecie_url" placeholder="https://...">

        <button type="submit">ZAREJESTRUJ W BAZIE</button>
      </form>
    </div>

    <!-- KARTOTEKA -->
    <div class="panel">
      <h2>[=] REJESTR KARTOTEK OSOBOWYCH</h2>
      <div id="cardsList" class="cards-grid">
        <!-- Karty ładowane dynamicznie -->
      </div>
    </div>
  </div>

  <script>
    const DEFAULT_AVATAR = 'https://via.placeholder.com/150/000000/FFFFFF?text=BRAK+ZDJECIA';

    async function loadOsoby() {
      const res = await fetch('/api/osoby');
      const data = await res.json();
      const container = document.getElementById('cardsList');
      container.innerHTML = '';

      data.forEach(osoba => {
        const card = document.createElement('div');
        card.className = 'person-card';
        
        // Zabezpieczenie przed brakiem/błędem zdjęcia
        const imgSrc = osoba.zdjecie ? osoba.zdjecie : DEFAULT_AVATAR;

        card.innerHTML = `
          <div class="photo-container">
            <img src="${imgSrc}" onerror="this.onerror=null; this.src='${DEFAULT_AVATAR}';" alt="Fotografia operacyjna">
          </div>
          <div class="info">
            <strong>${osoba.imie} ${osoba.nazwisko}</strong><br>
            <small>PESEL: ${osoba.pesel}</small><br>
            <span class="status-badge">${osoba.status}</span>
          </div>
        `;
        container.appendChild(card);
      });
    }

    document.getElementById('addPersonForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData(e.target);

      const res = await fetch('/api/osoby', {
        method: 'POST',
        body: formData
      });

      const result = await res.json();
      if (result.success) {
        e.target.reset();
        loadOsoby();
      } else {
        alert('BŁĄD: ' + result.message);
      }
    });

    loadOsoby();
  </script>
</body>
</html>
