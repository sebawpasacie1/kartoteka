<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KMP WDŚ - SYSTEM KARTOTEKI</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #05080a;
      color: #00ff66;
      font-family: 'Courier New', Courier, monospace;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      border: 2px solid #00ff66;
      padding: 20px;
      box-shadow: 0 0 15px rgba(0, 255, 102, 0.2);
    }
    header {
      border-bottom: 2px solid #00ff66;
      padding-bottom: 15px;
      margin-bottom: 20px;
      text-align: center;
    }
    h1 {
      font-size: 22px;
      letter-spacing: 2px;
    }
    .sub-header {
      font-size: 12px;
      color: #00aa44;
      margin-top: 5px;
    }
    .box {
      border: 1px solid #00aa44;
      padding: 15px;
      margin-bottom: 20px;
      background: rgba(0, 20, 5, 0.5);
    }
    .box-title {
      font-weight: bold;
      margin-bottom: 10px;
      color: #00ff66;
      border-bottom: 1px dashed #00aa44;
      padding-bottom: 5px;
    }
    input, textarea, select, button {
      background: #000;
      color: #00ff66;
      border: 1px solid #00ff66;
      font-family: 'Courier New', Courier, monospace;
      padding: 8px;
      margin: 6px 0;
      width: 100%;
      outline: none;
    }
    input:focus, textarea:focus, select:focus {
      box-shadow: 0 0 5px #00ff66;
    }
    button {
      cursor: pointer;
      background: #003311;
      font-weight: bold;
      transition: 0.2s;
    }
    button:hover {
      background: #006622;
    }
    .hidden {
      display: none;
    }
    .record-item {
      border: 1px solid #00aa44;
      padding: 10px;
      margin-top: 10px;
      background: #000;
    }
    .record-header {
      display: flex;
      justify-content: space-between;
      color: #fff;
      margin-bottom: 5px;
    }
    .status-tag {
      color: #ffcc00;
      font-weight: bold;
    }
    .msg {
      color: #ff3333;
      margin-top: 5px;
      font-size: 14px;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>KOMENDA MIEJSKA POLICJI — WDŚ</h1>
    <div class="sub-header">WYDZIAŁ DOCHODZENIOWO-ŚLEDCZY // BAZA DANYCH</div>
  </header>

  <!-- PANEL AUTORYZACJI -->
  <div id="auth-section" class="box">
    <div class="box-title">[ AUTORYZACJA FUNKCJONARIUSZA ]</div>
    <input type="text" id="username" placeholder="Identyfikator / Login">
    <input type="password" id="password" placeholder="Hasło dostępu">
    <button onclick="login()">ZALOGUJ DO SYSTEMU</button>
    <button onclick="register()">ZAREJESTRUJ NOWE KONTO</button>
    <div id="auth-msg" class="msg"></div>
  </div>

  <!-- PANEL GŁÓWNY SYSTEMU -->
  <div id="app-section" class="hidden">
    <div class="box">
      ZALOGOWANY FUNKCJONARIUSZ: <b id="user-display" style="color: #fff;"></b>
    </div>

    <!-- FORMULARZ DODAWANIA WPISU -->
    <div class="box">
      <div class="box-title">[ NOWY PROTOKÓŁ / WPRIS DO KARTOTEKI ]</div>
      <input type="text" id="rec-title" placeholder="Imię i Nazwisko / Nr Sprawy">
      <select id="rec-status">
        <option value="PODEJRZANY">PODEJRZANY</option>
        <option value="SWIADEK">ŚWIADEK</option>
        <option value="TYMCZASOWO ARESZTOWANY">TYMCZASOWO ARESZTOWANY</option>
        <option value="DENAT">DENAT / OGLĘDZINY ZWŁOK</option>
        <option value="MATERIAŁ DOWODOWY">EKSPERTYZA KRYMINALISTYCZNA</option>
      </select>
      <textarea id="rec-content" rows="4" placeholder="Treść przesłuchania, raportu lub wyników ekspertyzy..."></textarea>
      <button onclick="addRecord()">WPROWADŹ DANE DO BAZY</button>
    </div>

    <!-- REJESTR KARTOTEKI -->
    <div class="box">
      <div class="box-title">[ BAZA DANYCH KARTOTEKI ]</div>
      <button onclick="loadRecords()">ODŚWIEŻ REJESTR</button>
      <div id="records-list"></div>
    </div>
  </div>
</div>

<script>
  async function login() {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('username').value,
        password: document.getElementById('password').value
      })
    });
    const data = await res.json();
    if (data.success) {
      document.getElementById('auth-section').classList.add('hidden');
      document.getElementById('app-section').classList.remove('hidden');
      document.getElementById('user-display').innerText = data.username;
      loadRecords();
    } else {
      document.getElementById('auth-msg').innerText = data.message;
    }
  }

  async function register() {
    const res = await fetch('/api/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('username').value,
        password: document.getElementById('password').value
      })
    });
    const data = await res.json();
    document.getElementById('auth-msg').innerText = data.message;
  }

  async function addRecord() {
    await fetch('/api/records', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        title: document.getElementById('rec-title').value,
        status: document.getElementById('rec-status').value,
        content: document.getElementById('rec-content').value
      })
    });
    document.getElementById('rec-title').value = '';
    document.getElementById('rec-content').value = '';
    loadRecords();
  }

  async function loadRecords() {
    const res = await fetch('/api/records');
    const records = await res.json();
    const list = document.getElementById('records-list');
    list.innerHTML = '';
    records.forEach(r => {
      list.innerHTML += `
        <div class="record-item">
          <div class="record-header">
            <span><b>${r.title}</b></span>
            <span class="status-tag">[${r.status}]</span>
          </div>
          <p style="color: #ccc; margin-bottom: 5px;">${r.content}</p>
          <small style="color: #00aa44;">Wprowadził: ${r.created_by}</small>
        </div>
      `;
    });
  }
</script>

</body>
</html>
